<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Time tracking dashboard</title>

    <!-- Rubik Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- description -->
    <meta
      name="description"
      content="A FrontendMentor JavaScript learning path challenge design."
    />
    <!-- script file -->
    <script defer src="./main.js"></script>
    <!-- local stylesheet -->
    <link rel="stylesheet" href="./style/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="profile">
        <img class="profile-picture" src="./images/image-jeremy.png" alt="Jeremy Robson." />
        <h1 class="heading">
          <span>Report for </span>
          <strong>Jeremy Robson</strong>
        </h1>
      </div>

      <nav id="dashboard-display-controller" class="dashboard-display-controller">
        <button id="show-daily-time-button" class="button" type="button">Daily</button>
        <button id="show-weekly-time-button" class="button" type="button">Weekly</button>
        <button id="show-monthly-time-button" class="button" type="button">Monthly</button>
      </nav>
    </header>

    <main id="dashboard" class="dashboard daily">
      <!-- Time-trackers are dynamically rendered here. -->
    </main>
  </body>
</html>
